name: Usage stats

on:
  schedule:
    - cron: "0 5 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 stats.py
        env:
          GH_TOKEN: ${{ secrets.LANGS_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || (git commit -m "Update usage stats" && git push)
